name: Daily digest

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Addis Ababa
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print digest instead of sending"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bun run src/main.ts ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit corpus
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/digest.sqlite
          git diff --cached --quiet || git commit -m "data: digest $(date -u +%F)"
          git pull --rebase origin main
          git push
